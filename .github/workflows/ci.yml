name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: syntax, lint, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Environment
        run: |
          bash --version | head -1
          python3 --version
          shellcheck --version | grep -i '^version:'

      # Every shell script in the repo must at least parse.
      - name: Syntax check
        run: |
          set -e
          for f in nowhere-v2.sh nowhere-v3.sh nowhere-v1.sh install.sh install-source.sh tests/nowhere-v2.test.sh tests/nowhere-v3.test.sh; do
            bash -n "$f"
            echo "ok  $f"
          done

      # The V2/V3 managers and their test suites are held to the warning level.
      - name: shellcheck (V2/V3 managers + tests)
        run: shellcheck -S warning nowhere-v2.sh nowhere-v3.sh tests/nowhere-v2.test.sh tests/nowhere-v3.test.sh

      # The V1 scripts carry pre-existing SC2034 (unused variable) warnings, so
      # they are only held to the error level here. Tighten this once V1 is
      # cleaned up or dropped.
      - name: shellcheck (V1 scripts, errors only)
        run: shellcheck -S error nowhere-v1.sh install.sh install-source.sh

      # Sandboxed: rewrites the managers' path declarations into a temp dir, so
      # they need no root and never touch the real /etc/nowhere-* or systemd.
      - name: Test suite (V2)
        run: bash tests/nowhere-v2.test.sh

      - name: Test suite (V3)
        run: bash tests/nowhere-v3.test.sh

      # Offline targeted regressions for reviewed fix batches (stubbed
      # systemd/ACME; a local flock/install shim keeps it non-root friendly).
      - name: Targeted regression tests (Python)
        run: python3 tests/test_fixes.py .

      - name: Feature regression tests (Python)
        run: python3 tests/test_features.py .

      - name: Review regression tests (Python)
        run: python3 tests/test_review.py .

      - name: Core sync regression tests (Python)
        run: python3 tests/test_core_sync.py .
